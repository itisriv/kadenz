<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kadenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F1EF;
    --card:#FBFBFA;
    --ink:#141414;
    --line: rgba(20,20,20,0.14);
    --line-strong: rgba(20,20,20,0.55);
    --border: rgba(20,20,20,0.85);
    --muted:#8C887E;
    --amber-1:#FBDB86;
    --amber-2:#F2B233;
    --danger:#8A4A3A;
    --radius-card: 26px;
    --radius-pill: 999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none; overflow-x:hidden;}
  body{min-height:100vh; padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);}
  h1,h2,h3{font-family:'Bodoni Moda', serif; font-weight:700; margin:0; letter-spacing:-0.02em;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-appearance:none; background:none; color:inherit;}
  input{font-family:inherit;}
  .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted);
  }
  svg.ic{display:block;}

  /* ---------- App shell ---------- */
  .view{
    display:none; flex-direction:column;
    height:100vh; height:100dvh;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .view.active{display:flex;}

  /* ---------- List view ---------- */
  #view-list .topbar{
    position:relative; padding:30px 22px 46px;
  }
  .amber-blob{
    position:absolute; top:-120px; right:-110px; width:340px; height:340px; border-radius:50%;
    background: radial-gradient(circle, var(--amber-1) 0%, var(--amber-2) 38%, rgba(242,178,51,0.5) 60%, rgba(242,178,51,0) 85%);
    filter: blur(38px);
    pointer-events:none; z-index:0;
  }
  #view-list h1{font-size:38px; position:relative; z-index:1;}
  .routine-list{padding:26px 22px 170px; display:flex; flex-direction:column; gap:16px; position:relative; z-index:1;}
  .r-card{
    background:var(--card); border-radius:var(--radius-card); padding:22px 22px 20px;
    border:1px solid var(--border);
  }
  .r-card h2{font-size:25px;}
  .r-card .r-meta{margin-top:5px;}
  .r-strip{display:flex; gap:4px; margin-top:16px; height:3px;}
  .r-strip i{display:block; height:3px; border-radius:3px; background:var(--line);}
  .r-strip i.on{background:var(--amber-2);}
  .r-actions{display:flex; gap:10px; margin-top:18px; align-items:center;}
  .pill{
    padding:15px 20px; border-radius:var(--radius-pill); font-size:12px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase;
    border:1px solid var(--border); text-align:center; background:transparent; color:var(--ink);
  }
  .pill.solid{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .pill-start{flex:1;}
  .icon-circle{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .dashed{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:16px; border-radius:var(--radius-pill); border:1.5px dashed var(--line-strong);
    color:var(--muted); font-size:12px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; margin-top:2px;
  }
  .fab-row{
    position:fixed; left:0; right:0; bottom:calc(74px + var(--safe-bottom)); padding:16px 22px 8px; z-index:5;
    background:linear-gradient(180deg, rgba(242,238,231,0) 0%, var(--paper) 46%);
  }
  .empty{margin:60px 22px 0; text-align:center; color:var(--muted); position:relative; z-index:1;}
  .empty h3{color:var(--ink); font-size:20px; margin-bottom:8px; font-family:'Bodoni Moda',serif;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--paper);
    border-top:1px solid var(--line); padding:10px 12px calc(10px + var(--safe-bottom)); gap:4px; z-index:20;
  }
  .tabbar button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 0;
    color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  }
  .tabbar button svg{stroke:var(--muted);}
  .tabbar button.active{color:var(--ink);}
  .tabbar button.active svg{stroke:var(--ink);}
  .home-indicator{
    position:fixed; left:0; right:0; bottom:6px; display:flex; justify-content:center; z-index:21; pointer-events:none;
  }
  .home-indicator i{width:110px; height:4px; border-radius:3px; background:var(--line-strong);}

  /* ---------- Editor view ---------- */
  .header-bar{
    padding:18px 14px 14px; display:flex; align-items:center; gap:6px;
    position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .header-bar .icon-plain{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink);
  }
  .header-bar .header-eyebrow{
    flex:1; text-align:center; font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
  }
  .editor-title-input{
    display:block; width:100%; font-family:'Bodoni Moda', serif; font-size:30px; font-weight:700; letter-spacing:-0.02em;
    background:transparent; border:none; outline:none; color:var(--ink); padding:6px 4px 18px;
  }
  .editor-title-input::placeholder{color:var(--muted);}
  #view-editor .body{padding:0 18px 150px; flex:1;}
  .phase-row{
    background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 14px; margin-bottom:12px;
    display:flex; align-items:center; gap:10px;
    transition: transform 0.15s ease;
  }
  .phase-row.dragging{
    transition:none; z-index:30; position:relative;
    box-shadow:0 10px 24px rgba(20,20,20,0.18);
  }
  .phase-row .grip{
    color:var(--line-strong); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    width:26px; height:38px; touch-action:none; cursor:grab; flex:none;
  }
  .phase-row .grip svg{display:block;}
  .phase-row .grip:active{cursor:grabbing;}
  .phase-row .fields{flex:1; display:flex; flex-direction:column; gap:9px;}
  .phase-row input[type="text"]{
    border:none; border-bottom:1px solid transparent; font-size:16px; font-weight:600; padding:2px 0; outline:none; background:transparent; font-family:'Inter',sans-serif;
  }
  .phase-row input[type="text"]:focus{border-bottom-color:var(--ink);}
  .dur-row{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;}
  .dur-row input{width:44px; text-align:center; border:1px solid var(--border); border-radius:var(--radius-pill); padding:6px 2px; font-size:13px; color:var(--ink); font-family:'Inter',sans-serif;}
  .remove-phase{color:var(--muted); font-size:15px; padding:6px 8px;}
  .editor-footer{
    position:fixed; left:0; right:0; bottom:0; padding:16px 18px calc(16px + var(--safe-bottom));
    background:var(--paper); display:flex; gap:10px;
  }

  /* ---------- Run view ---------- */
  #view-run{background:var(--paper); color:var(--ink);}
  #runActiveWrap{display:flex; flex-direction:column; flex:1;}
  .run-top{padding:22px 20px 0; display:flex; justify-content:space-between; align-items:center;}
  .run-top button{color:var(--ink); display:flex; align-items:center; justify-content:center; width:38px; height:38px;}
  .run-eyebrow{text-align:center; color:var(--muted); font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;}
  .run-center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:0 24px;}
  .time-big{font-family:'Bodoni Moda',serif; font-size:min(17vw, 72px); font-weight:600; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; text-align:center;}
  .run-phase-name{font-family:'Bodoni Moda',serif; font-size:24px; font-weight:700; text-align:center; padding:0 10px;}
  .next-up{font-size:13px; color:var(--muted); text-align:center;}
  .next-up b{color:var(--ink); font-weight:600;}
  .run-controls{display:flex; gap:14px; align-items:center; width:100%; max-width:340px;}
  .ctrl-round{
    width:56px; height:56px; border-radius:50%; border:1px solid var(--border); flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .ctrl-main{
    flex:1; height:56px; border-radius:var(--radius-pill); background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase;
  }
  .timeline{
    display:flex; gap:4px; padding:0 20px calc(22px + var(--safe-bottom)); margin-top:20px;
  }
  .timeline i{
    display:block; height:3px; border-radius:3px; background:var(--line); position:relative; overflow:hidden;
  }
  .timeline i.done{background:var(--line-strong);}
  .timeline i.current::after{
    content:""; position:absolute; left:0; top:0; bottom:0; background:var(--amber-2); width:var(--p, 0%);
  }
  .done-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px;}
  .done-screen h2{font-size:30px;}
  .done-screen p{color:var(--muted); font-size:14px; margin:0;}

  /* ---------- Streak view ---------- */
  #view-streak .topbar{padding:30px 22px 10px;}
  #view-streak h1{font-size:36px;}
  .filter-row{display:flex; align-items:center; gap:8px; padding:16px 22px 4px; flex-wrap:wrap;}
  .chip{
    padding:9px 16px; border-radius:var(--radius-pill); font-size:12px; font-weight:500; letter-spacing:0.06em; white-space:nowrap;
    background:transparent; border:1px solid var(--border); color:var(--ink); flex:none; min-height:20px;
  }
  .chip.active{background:var(--amber-2); color:var(--ink); border-color:var(--amber-2);}
  .stat-row{display:flex; gap:12px; padding:18px 22px 6px;}
  .stat-card{
    flex:1; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:16px 18px;
  }
  .stat-card .num{font-family:'Bodoni Moda',serif; font-size:32px; font-weight:700; color:var(--ink);}
  .stat-card .label{margin-top:3px;}
  .cal-wrap{padding:20px 22px 140px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:7px;}
  .cal-weekdays span{font-size:10px; text-align:center; color:var(--muted); font-weight:600;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-cell{
    aspect-ratio:1; border-radius:50%; background:transparent; border:1px solid var(--line);
  }
  .cal-cell.done{background:var(--amber-2); border-color:var(--amber-2);}
  .cal-cell.missed{background:transparent; border:1px solid var(--line-strong);}
  .cal-cell.today.pending{background:transparent; border:1.5px dashed var(--ink);}
  .cal-cell.future{background:transparent; border:1px solid var(--line);}
  .cal-legend{display:flex; gap:16px; padding:14px 22px 0; font-size:11.5px; color:var(--muted); flex-wrap:wrap;}
  .cal-legend span{display:flex; align-items:center; gap:6px;}
  .cal-legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .empty-streak{margin:40px 22px 0; text-align:center; color:var(--muted);}
  .empty-streak h3{color:var(--ink); font-size:19px; margin-bottom:8px; font-family:'Bodoni Moda',serif;}

  @media (min-width:560px){
    body{max-width:480px; margin:0 auto; box-shadow:0 0 40px rgba(0,0,0,0.06);}
  }
</style>
</head>
<body>

<!-- ============ LIST VIEW ============ -->
<div class="view active" id="view-list">
  <div class="topbar">
    <div class="amber-blob"></div>
    <h1>Kadenz</h1>
  </div>
  <div class="routine-list" id="routineList"></div>
  <div class="fab-row"><button class="dashed" id="btnNewRoutine">+&nbsp; Neue Routine</button></div>
</div>

<!-- ============ STREAK VIEW ============ -->
<div class="view" id="view-streak">
  <div class="topbar"><h1>Streak</h1></div>
  <div class="filter-row" id="streakFilters"></div>
  <div class="stat-row">
    <div class="stat-card"><div class="num" id="streakCurrent">0</div><div class="label eyebrow">Tage in Folge</div></div>
    <div class="stat-card"><div class="num" id="streakBest">0</div><div class="label eyebrow">Längste Serie</div></div>
  </div>
  <div class="cal-legend">
    <span><i style="background:var(--amber-2)"></i>erledigt</span>
    <span><i style="background:transparent;border:1.5px solid var(--line-strong)"></i>verpasst</span>
    <span><i style="background:transparent;border:1.5px dashed var(--ink)"></i>heute noch offen</span>
    <span><i style="background:rgba(25,25,26,0.05)"></i>vor Beginn der Routine</span>
  </div>
  <div class="cal-wrap">
    <div class="cal-weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="empty-streak" id="streakEmpty" style="display:none;">
      <h3>Noch keine Daten</h3>
      <p>Schließe eine Routine ab, damit hier dein Verlauf erscheint.</p>
    </div>
  </div>
</div>

<!-- ============ EDITOR VIEW ============ -->
<div class="view" id="view-editor">
  <div class="header-bar">
    <button class="icon-plain" id="btnEditorBack">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="header-eyebrow" id="editorTotalDuration"></div>
    <button class="icon-plain" id="btnDuplicateRoutine" title="Duplizieren">
      <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
    <button class="icon-plain" id="btnDeleteRoutine" title="Löschen">
      <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H9.8a2 2 0 0 1-2-1.9L7 7"/></svg>
    </button>
  </div>
  <div class="body">
    <input class="editor-title-input" id="routineNameInput" placeholder="Name der Routine">
    <div id="phaseList"></div>
    <button class="dashed" id="btnAddPhase">+&nbsp; Schritt hinzufügen</button>
  </div>
  <div class="editor-footer">
    <button class="pill solid pill-start" id="btnSaveRoutine">Speichern</button>
  </div>
</div>

<!-- ============ RUN VIEW ============ -->
<div class="view" id="view-run">
  <div class="run-top">
    <button id="btnRunExit" title="Beenden">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="run-eyebrow" id="runRoutineName"></div>
    <div style="width:38px;"></div>
  </div>
  <div id="runActiveWrap">
    <div class="run-center">
      <div class="time-big" id="runTime">00:00</div>
      <div class="run-phase-name" id="runPhaseName"></div>
      <div class="next-up" id="runNextUp"></div>
      <div class="run-controls">
        <button class="ctrl-round" id="btnRunBack">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="ctrl-main" id="btnRunPause">
          <span id="pauseLabel">Pause</span>
        </button>
        <button class="ctrl-round" id="btnRunFwd">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <div class="timeline" id="runTimeline"></div>
  </div>
  <div class="done-screen" id="runDoneScreen" style="display:none;">
    <h2>Geschafft.</h2>
    <p id="runDoneText"></p>
    <button class="pill solid" style="margin-top:20px; width:auto; padding:14px 28px;" id="btnRunDoneClose">Fertig</button>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <button data-tab="list" class="active">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    Routinen
  </button>
  <button data-tab="streak">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    Streak
  </button>
</div>
<div class="home-indicator"><i></i></div>

<audio id="chime" preload="auto"></audio>

<script>
/* ---------------------------------------------------------
   Kadenz — lokale Routine-Timer-App
   Datenhaltung: localStorage, kein Server, keine Accounts.
--------------------------------------------------------- */

const STORE_KEY = 'kadenz_routines_v1';
const COMPLETIONS_KEY = 'kadenz_completions_v1';

const seedData = () => ([
  {
    id: crypto.randomUUID(),
    name: 'Morgenroutine',
    createdAt: Date.now(),
    phases: [
      {id: crypto.randomUUID(), name: 'Wasser trinken & Licht', sec: 120},
      {id: crypto.randomUUID(), name: 'Dehnen', sec: 300},
      {id: crypto.randomUUID(), name: 'Journaling', sec: 300},
      {id: crypto.randomUUID(), name: 'Duschen', sec: 600},
    ]
  },
  {
    id: crypto.randomUUID(),
    name: 'Abendroutine',
    createdAt: Date.now(),
    phases: [
      {id: crypto.randomUUID(), name: 'Bildschirme weglegen', sec: 60},
      {id: crypto.randomUUID(), name: 'Lesen', sec: 900},
      {id: crypto.randomUUID(), name: 'Tag reflektieren', sec: 180},
    ]
  }
]);

function loadRoutines(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){ const seed = seedData(); saveRoutines(seed); return seed; }
    const parsed = JSON.parse(raw);
    parsed.forEach(r => { if(!r.createdAt) r.createdAt = Date.now(); });
    return parsed;
  }catch(e){ console.error('Ladefehler', e); return seedData(); }
}
function saveRoutines(routines){
  localStorage.setItem(STORE_KEY, JSON.stringify(routines));
}

/* completions: { "YYYY-MM-DD": { routineId: true, routineId2: true } } */
function loadCompletions(){
  try{
    const raw = localStorage.getItem(COMPLETIONS_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ console.error('Ladefehler (Completions)', e); return {}; }
}
function saveCompletions(c){
  localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(c));
}
function dateStr(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function logCompletion(routineId){
  const completions = loadCompletions();
  const key = dateStr(new Date());
  if(!completions[key]) completions[key] = {};
  completions[key][routineId] = true;
  saveCompletions(completions);
}

let routines = loadRoutines();
let editingId = null;      // Routine, die gerade im Editor ist
let run = null;            // aktiver Lauf-Status

const $ = sel => document.querySelector(sel);
const views = {
  list: document.getElementById('view-list'),
  editor: document.getElementById('view-editor'),
  run: document.getElementById('view-run'),
  streak: document.getElementById('view-streak'),
};
function showView(name){
  Object.values(views).forEach(v => v.classList.remove('active'));
  views[name].classList.add('active');
  const tabbar = document.getElementById('tabbar');
  const showTabs = (name === 'list' || name === 'streak');
  tabbar.style.display = showTabs ? 'flex' : 'none';
  document.querySelector('.home-indicator').style.display = showTabs ? 'flex' : 'none';
  if(showTabs){
    document.querySelectorAll('#tabbar button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab === name);
    });
  }
  if(name === 'streak') renderStreak();
}
document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  showView(btn.dataset.tab);
});

function fmt(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function totalDuration(r){ return r.phases.reduce((a,p)=>a+p.sec,0); }
function humanDuration(sec){
  const m = Math.round(sec/60);
  if(m < 60) return m + ' Min';
  const h = Math.floor(m/60), rem = m%60;
  return rem ? `${h} Std ${rem} Min` : `${h} Std`;
}

/* ---------------- LIST VIEW ---------------- */
function renderList(){
  const wrap = document.getElementById('routineList');
  wrap.innerHTML = '';
  if(routines.length === 0){
    wrap.innerHTML = `<div class="empty"><h3>Noch keine Routine</h3><p>Leg deine erste Morgen- oder Abendroutine an.</p></div>`;
    return;
  }
  routines.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'r-card';
    const total = totalDuration(r);
    card.innerHTML = `
      <h2>${escapeHtml(r.name)}</h2>
      <div class="r-meta eyebrow">${r.phases.length} Schritte · ${humanDuration(total)}</div>
      <div class="r-strip">${r.phases.map((p,i)=>`<i class="${i===0?'on':''}" style="flex:${Math.max(p.sec,1)}"></i>`).join('')}</div>
      <div class="r-actions">
        <button class="pill pill-start" data-start="${r.id}">Start</button>
        <button class="icon-circle" data-edit="${r.id}" title="Bearbeiten">
          <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-circle" data-duplicate="${r.id}" title="Duplizieren">
          <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
    `;
    wrap.appendChild(card);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

document.getElementById('routineList').addEventListener('click', e=>{
  const startBtn = e.target.closest('[data-start]');
  const editBtn = e.target.closest('[data-edit]');
  const dupBtn = e.target.closest('[data-duplicate]');
  if(startBtn) startRun(startBtn.dataset.start);
  if(editBtn) openEditor(editBtn.dataset.edit);
  if(dupBtn){
    const copy = duplicateRoutine(dupBtn.dataset.duplicate);
    if(copy) openEditor(copy.id);
  }
});

function duplicateRoutine(id){
  const original = routines.find(x=>x.id===id);
  if(!original) return null;
  const copy = {
    id: crypto.randomUUID(),
    name: (original.name || 'Ohne Namen').trim() + ' (Kopie)',
    createdAt: Date.now(),
    phases: original.phases.map(p => ({id: crypto.randomUUID(), name: p.name, sec: p.sec}))
  };
  const idx = routines.findIndex(x=>x.id===id);
  routines.splice(idx+1, 0, copy);
  saveRoutines(routines);
  return copy;
}

document.getElementById('btnNewRoutine').addEventListener('click', ()=>{
  const r = { id: crypto.randomUUID(), name: '', createdAt: Date.now(), phases: [] };
  routines.push(r);
  openEditor(r.id, true);
});

/* ---------------- EDITOR VIEW ---------------- */
function openEditor(id, isNew=false){
  editingId = id;
  const r = routines.find(x=>x.id===id);
  document.getElementById('routineNameInput').value = r.name;
  renderPhaseList(r);
  showView('editor');
  if(isNew) document.getElementById('routineNameInput').focus();
}
function updateEditorTotal(r){
  const el = document.getElementById('editorTotalDuration');
  if(!el) return;
  el.textContent = r.phases.length === 0
    ? 'Noch keine Schritte'
    : `${r.phases.length} Schritte · ${humanDuration(totalDuration(r))}`;
}
function renderPhaseList(r){
  const wrap = document.getElementById('phaseList');
  wrap.innerHTML = '';
  r.phases.forEach((p, idx)=>{
    const row = document.createElement('div');
    row.className = 'phase-row';
    row.dataset.idx = idx;
    const mm = Math.floor(p.sec/60), ss = p.sec%60;
    row.innerHTML = `
      <div class="grip" data-drag="${idx}">
        <svg width="14" height="8" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l8-5 8 5"/></svg>
        <svg width="14" height="8" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8 5 8-5"/></svg>
      </div>
      <div class="fields">
        <input type="text" data-name="${idx}" value="${escapeHtml(p.name)}" placeholder="Schritt-Name">
        <div class="dur-row">
          <input type="number" min="0" max="180" data-min="${idx}" value="${mm}"> Min
          <input type="number" min="0" max="59" data-sec="${idx}" value="${ss}"> Sek
        </div>
      </div>
      <button class="remove-phase" data-remove="${idx}">✕</button>
    `;
    wrap.appendChild(row);
  });
  updateEditorTotal(r);
}
document.getElementById('phaseList').addEventListener('click', e=>{
  const r = routines.find(x=>x.id===editingId);
  if(e.target.hasAttribute('data-remove')){
    r.phases.splice(+e.target.dataset.remove, 1); renderPhaseList(r);
  }
});
document.getElementById('phaseList').addEventListener('input', e=>{
  const r = routines.find(x=>x.id===editingId);
  if(e.target.hasAttribute('data-name')) r.phases[+e.target.dataset.name].name = e.target.value;
  if(e.target.hasAttribute('data-min')){
    const i = +e.target.dataset.min;
    const ss = r.phases[i].sec % 60;
    r.phases[i].sec = Math.max(0,(+e.target.value||0))*60 + ss;
  }
  if(e.target.hasAttribute('data-sec')){
    const i = +e.target.dataset.sec;
    const mm = Math.floor(r.phases[i].sec/60);
    r.phases[i].sec = mm*60 + Math.min(59, Math.max(0,(+e.target.value||0)));
  }
  updateEditorTotal(r);
});
document.getElementById('btnAddPhase').addEventListener('click', ()=>{
  const r = routines.find(x=>x.id===editingId);
  r.phases.push({id: crypto.randomUUID(), name: '', sec: 300});
  renderPhaseList(r);
});
document.getElementById('btnSaveRoutine').addEventListener('click', ()=>{
  const r = routines.find(x=>x.id===editingId);
  r.name = document.getElementById('routineNameInput').value.trim() || 'Ohne Namen';
  r.phases = r.phases.filter(p => p.name.trim() !== '');
  saveRoutines(routines);
  renderList(); showView('list');
});
document.getElementById('btnDuplicateRoutine').addEventListener('click', ()=>{
  const r = routines.find(x=>x.id===editingId);
  if(!r) return;
  r.name = document.getElementById('routineNameInput').value.trim() || r.name;
  const copy = duplicateRoutine(editingId);
  saveRoutines(routines);
  openEditor(copy.id);
  const nameInput = document.getElementById('routineNameInput');
  nameInput.focus(); nameInput.select();
});

/* ---- Drag & Drop zum Umsortieren der Schritte ---- */
let dragCtx = null;

document.getElementById('phaseList').addEventListener('pointerdown', e=>{
  const grip = e.target.closest('[data-drag]');
  if(!grip) return;
  const r = routines.find(x=>x.id===editingId);
  const wrap = document.getElementById('phaseList');
  const rows = Array.from(wrap.children);
  const originIdx = +grip.dataset.drag;
  const row = rows[originIdx];
  const rect = row.getBoundingClientRect();
  const rowHeight = row.offsetHeight + parseFloat(getComputedStyle(row).marginBottom || 0);
  dragCtx = { r, wrap, rows, originIdx, targetIdx: originIdx, startY: e.clientY, rowHeight, row };
  row.classList.add('dragging');
  try{ grip.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
document.getElementById('phaseList').addEventListener('pointermove', e=>{
  if(!dragCtx) return;
  const dy = e.clientY - dragCtx.startY;
  dragCtx.row.style.transform = `translateY(${dy}px)`;
  const steps = Math.round(dy / dragCtx.rowHeight);
  const len = dragCtx.rows.length;
  const targetIdx = Math.min(len-1, Math.max(0, dragCtx.originIdx + steps));
  dragCtx.targetIdx = targetIdx;
  dragCtx.rows.forEach((rowEl, i)=>{
    if(i === dragCtx.originIdx) return;
    let shift = 0;
    if(dragCtx.originIdx < targetIdx && i > dragCtx.originIdx && i <= targetIdx) shift = -1;
    else if(dragCtx.originIdx > targetIdx && i < dragCtx.originIdx && i >= targetIdx) shift = 1;
    rowEl.style.transform = shift ? `translateY(${shift*dragCtx.rowHeight}px)` : '';
  });
});
function endDrag(){
  if(!dragCtx) return;
  const { r, originIdx, targetIdx } = dragCtx;
  if(targetIdx !== originIdx){
    const [moved] = r.phases.splice(originIdx, 1);
    r.phases.splice(targetIdx, 0, moved);
  }
  dragCtx.rows.forEach(rowEl => { rowEl.style.transform = ''; rowEl.classList.remove('dragging'); });
  dragCtx = null;
  renderPhaseList(r);
}
document.getElementById('phaseList').addEventListener('pointerup', endDrag);
document.getElementById('phaseList').addEventListener('pointercancel', endDrag);
document.getElementById('btnDeleteRoutine').addEventListener('click', ()=>{
  if(confirm('Diese Routine wirklich löschen?')){
    routines = routines.filter(x=>x.id!==editingId);
    saveRoutines(routines);
    if(streakFilter === editingId) streakFilter = 'all';
    renderList(); showView('list');
  }
});
document.getElementById('btnEditorBack').addEventListener('click', ()=>{
  const r = routines.find(x=>x.id===editingId);
  if(r && r.name.trim()==='' && r.phases.every(p=>p.name.trim()==='')){
    routines = routines.filter(x=>x.id!==editingId);
  }
  renderList(); showView('list');
});

/* ---------------- RUN VIEW ---------------- */
let timerId = null;

function startRun(routineId){
  const r = routines.find(x=>x.id===routineId);
  if(!r || r.phases.length===0){ alert('Diese Routine hat noch keine Schritte.'); return; }
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  run = {
    routine: r,
    idx: 0,
    remaining: r.phases[0].sec,
    paused: false,
  };
  document.getElementById('runActiveWrap').style.display = '';
  document.getElementById('runDoneScreen').style.display = 'none';
  renderTimeline();
  renderRunFrame();
  showView('run');
  clearInterval(timerId);
  timerId = setInterval(tickRun, 1000);
}

function currentPhase(){ return run.routine.phases[run.idx]; }

function renderTimeline(){
  const wrap = document.getElementById('runTimeline');
  wrap.innerHTML = '';
  run.routine.phases.forEach((p,i)=>{
    const seg = document.createElement('i');
    seg.style.flex = Math.max(p.sec,1);
    if(i < run.idx) seg.classList.add('done');
    if(i === run.idx) seg.classList.add('current');
    seg.dataset.idx = i;
    wrap.appendChild(seg);
  });
}

function renderRunFrame(){
  const p = currentPhase();
  document.getElementById('runPhaseName').textContent = p.name;
  document.getElementById('runTime').textContent = fmt(run.remaining);
  document.getElementById('runRoutineName').textContent =
    `${String(run.idx+1).padStart(2,'0')} / ${String(run.routine.phases.length).padStart(2,'0')} · ${run.routine.name.toUpperCase()}`;
  const next = run.routine.phases[run.idx+1];
  document.getElementById('runNextUp').innerHTML = next
    ? `Als Nächstes: <b>${escapeHtml(next.name)}</b>`
    : `Letzter Schritt`;

  const progress = 1 - (run.remaining / p.sec);
  const segs = document.querySelectorAll('#runTimeline i');
  segs.forEach((seg,i)=>{
    seg.classList.toggle('done', i < run.idx);
    seg.classList.toggle('current', i === run.idx);
    if(i===run.idx) seg.style.setProperty('--p', (progress*100)+'%');
  });

  document.getElementById('pauseLabel').textContent = run.paused ? 'Weiter' : 'Pause';
}

function tickRun(){
  if(!run || run.paused) return;
  run.remaining -= 1;
  if(run.remaining <= 0){
    advancePhase(true);
    return;
  }
  renderRunFrame();
}

function alertUser(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.001;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
    o.stop(ctx.currentTime+0.55);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('Kadenz', {body: 'Nächster Schritt: ' + (run.routine.phases[run.idx+1]?.name || 'Routine beendet')}); }catch(e){}
  }
}

function advancePhase(fromTimer){
  if(fromTimer) alertUser();
  run.idx += 1;
  if(run.idx >= run.routine.phases.length){
    finishRun();
    return;
  }
  run.remaining = run.routine.phases[run.idx].sec;
  renderTimeline();
  renderRunFrame();
}

function finishRun(){
  clearInterval(timerId);
  alertUser();
  logCompletion(run.routine.id);
  document.getElementById('runActiveWrap').style.display = 'none';
  document.getElementById('runDoneScreen').style.display = 'flex';
  document.getElementById('runDoneText').textContent = `${run.routine.name} abgeschlossen — ${run.routine.phases.length} Schritte.`;
}

document.getElementById('btnRunPause').addEventListener('click', ()=>{
  run.paused = !run.paused; renderRunFrame();
});
document.getElementById('btnRunFwd').addEventListener('click', ()=> advancePhase(false));
document.getElementById('btnRunBack').addEventListener('click', ()=>{
  if(run.idx>0){ run.idx -= 1; run.remaining = currentPhase().sec; renderTimeline(); renderRunFrame(); }
  else { run.remaining = currentPhase().sec; renderRunFrame(); }
});
document.getElementById('btnRunExit').addEventListener('click', ()=>{
  if(confirm('Routine abbrechen?')){
    clearInterval(timerId); run=null; renderList(); showView('list');
  }
});
document.getElementById('btnRunDoneClose').addEventListener('click', ()=>{
  clearInterval(timerId); run=null; renderList(); showView('list');
});

/* ---------------- STREAK VIEW ---------------- */
let streakFilter = 'all';

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }

function isDoneOn(ds, completions, filterId){
  const day = completions[ds];
  if(!day) return false;
  if(filterId === 'all') return Object.keys(day).length > 0;
  return !!day[filterId];
}

function relevantStart(filterId){
  if(filterId === 'all'){
    if(routines.length === 0) return startOfDay(new Date());
    return startOfDay(new Date(Math.min(...routines.map(r=>r.createdAt || Date.now()))));
  }
  const r = routines.find(x=>x.id===filterId);
  return startOfDay(new Date(r ? (r.createdAt||Date.now()) : Date.now()));
}

function computeStreaks(filterId){
  const completions = loadCompletions();
  const today = startOfDay(new Date());
  const start = relevantStart(filterId);

  let current = 0;
  let cursor = today;
  if(!isDoneOn(dateStr(today), completions, filterId)) cursor = addDays(today, -1);
  while(cursor >= start && isDoneOn(dateStr(cursor), completions, filterId)){
    current += 1;
    cursor = addDays(cursor, -1);
  }

  let best = 0, run = 0;
  for(let d = new Date(start); d <= today; d = addDays(d,1)){
    if(isDoneOn(dateStr(d), completions, filterId)){ run += 1; best = Math.max(best, run); }
    else run = 0;
  }
  return {current, best, completions, start, today};
}

function renderStreak(){
  const wrap = document.getElementById('streakFilters');
  wrap.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (streakFilter==='all' ? ' active' : '');
  allChip.textContent = 'Alle Routinen';
  allChip.dataset.filter = 'all';
  wrap.appendChild(allChip);
  routines.forEach(r=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (streakFilter===r.id ? ' active' : '');
    chip.textContent = r.name;
    chip.dataset.filter = r.id;
    wrap.appendChild(chip);
  });

  if(routines.length === 0){
    document.getElementById('streakCurrent').textContent = '0';
    document.getElementById('streakBest').textContent = '0';
    document.getElementById('calGrid').innerHTML = '';
    document.getElementById('streakEmpty').style.display = 'block';
    return;
  }

  const {current, best, completions, today} = computeStreaks(streakFilter);
  document.getElementById('streakCurrent').textContent = current;
  document.getElementById('streakBest').textContent = best;

  const createdAt = relevantStart(streakFilter);
  const weeksToShow = 10;
  const todayDow = (today.getDay()+6)%7;
  const gridEnd = addDays(today, 6-todayDow);
  const gridStart = addDays(gridEnd, -(weeksToShow*7-1));

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  let anyCompletion = Object.keys(completions).length > 0;
  document.getElementById('streakEmpty').style.display = anyCompletion ? 'none' : 'block';

  for(let d = new Date(gridStart); d <= gridEnd; d = addDays(d,1)){
    const cell = document.createElement('div');
    const ds = dateStr(d);
    const isToday = ds === dateStr(today);
    if(d > today || d < createdAt){
      cell.className = 'cal-cell future';
    } else if(isToday){
      cell.className = 'cal-cell today ' + (isDoneOn(ds, completions, streakFilter) ? 'done' : 'pending');
    } else {
      cell.className = 'cal-cell ' + (isDoneOn(ds, completions, streakFilter) ? 'done' : 'missed');
    }
    cell.title = ds;
    grid.appendChild(cell);
  }
}

document.getElementById('streakFilters').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-filter]');
  if(!btn) return;
  streakFilter = btn.dataset.filter;
  renderStreak();
});

/* ---------------- Init ---------------- */
renderList();
</script>
